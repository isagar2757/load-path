<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>load-path</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 1.5rem; max-width: 52rem; }
    #feed { list-style: none; padding: 0; margin: 1rem 0; }
    #feed li { padding: 0.5rem 0; border-bottom: 1px solid #ddd; font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    button { padding: 0.4rem 0.9rem; }
    #status { color: #444; }
    #conditions { list-style: none; padding: 0; }
    #conditions li { padding: 0.4rem 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>load-path</h1>
  <p>Session feed, stop, and condition approval. Control surface only.</p>
  <div class="row">
    <label>session_id <input id="session" size="28" /></label>
    <button type="button" id="stop">Stop</button>
    <span id="status"></span>
  </div>
  <h2>Pending conditions</h2>
  <ul id="conditions"></ul>
  <h2>Feed</h2>
  <ul id="feed"></ul>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionInput = document.getElementById("session");
    const feed = document.getElementById("feed");
    const statusEl = document.getElementById("status");
    let source = null;

    sessionInput.value = params.get("session_id") || "";

    function connect() {
      const sid = sessionInput.value.trim();
      if (!sid) { statusEl.textContent = "set session_id"; return; }
      if (source) source.close();
      statusEl.textContent = "listening…";
      source = new EventSource("/events?session_id=" + encodeURIComponent(sid));
      source.onmessage = (ev) => {
        const li = document.createElement("li");
        li.textContent = ev.data;
        feed.prepend(li);
        if (JSON.parse(ev.data).tool?.endsWith("_condition")) loadConditions();
      };
      source.onerror = () => { statusEl.textContent = "stream error / reconnecting"; };
    }

    const conditionsEl = document.getElementById("conditions");
    const ACTOR = "user:owner_a";

    async function decide(action, body) {
      const sid = sessionInput.value.trim();
      const r = await fetch("/sessions/" + encodeURIComponent(sid) + "/conditions/" + action, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ actor_id: ACTOR, ...body }),
      });
      const out = await r.json();
      statusEl.textContent = r.ok ? (action + " ok: " + body.condition_id)
        : (action + " refused (" + r.status + "): " + JSON.stringify(out.detail));
      loadConditions();
    }

    async function loadConditions() {
      const sid = sessionInput.value.trim();
      if (!sid) return;
      const r = await fetch("/sessions/" + encodeURIComponent(sid) + "/conditions");
      conditionsEl.replaceChildren();
      if (!r.ok) { statusEl.textContent = "conditions failed: " + r.status; return; }
      for (const c of await r.json()) {
        const li = document.createElement("li");
        li.className = "row";
        const label = document.createElement("span");
        label.textContent = c.asset_id + " · " + c.year + " · rating " + c.rating;
        const approve = document.createElement("button");
        approve.type = "button";
        approve.textContent = "Approve";
        approve.addEventListener("click", () => decide("approve", { condition_id: c._id }));
        const reason = document.createElement("input");
        reason.placeholder = "reason";
        const reject = document.createElement("button");
        reject.type = "button";
        reject.textContent = "Reject";
        reject.addEventListener("click", () => decide("reject", { condition_id: c._id, reason: reason.value }));
        li.append(label, approve, reason, reject);
        conditionsEl.append(li);
      }
    }

    function start() { connect(); loadConditions(); }
    sessionInput.addEventListener("change", start);
    if (sessionInput.value) start();

    document.getElementById("stop").addEventListener("click", async () => {
      const sid = sessionInput.value.trim();
      if (!sid) return;
      const r = await fetch("/sessions/" + encodeURIComponent(sid) + "/stop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ aborted_by: "user:owner_a" }),
      });
      statusEl.textContent = r.ok ? "abort_requested" : ("stop failed: " + r.status);
    });
  </script>
</body>
</html>
