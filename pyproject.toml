[project]
name = "load-path"
version = "0.1.0"
description = "Audited capital-program agents on MongoDB Atlas"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pymongo>=4.20,<5",
    "certifi>=2026.10.23",
    "pydantic>=2.14,<3",
    "scipy>=1.18,<2",
    "scikit-learn>=1.9,<2",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
